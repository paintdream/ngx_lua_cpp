# ===========================================================================
# ngx_lua_cpp demo center - Linux-only native stream UDP (sample)
#
# On Linux, nginx's stream module DOES support datagram listeners
# ("listen ... udp", nginx core >= 1.9.13), so you can serve UDP directly
# from nginx.conf with ngx_stream_lua. This config shows how; it is NOT
# loadable on Windows (nginx compiles "listen ... udp" out under NGX_WIN32).
#
# The ngx_lua_cpp C++-owned listeners (demo/udp_echo_server.lua) work on
# every platform, including Linux -- pick whichever fits your deployment.
#
# Usage (Linux, in addition to the http block of web/nginx.conf):
#   stream {
#       init_worker_by_lua_block {
#           local prefix = ngx.config.prefix()
#           package.path = package.path .. ";" .. prefix .. "../../demo/?.lua"
#           package.cpath = package.cpath .. ";" .. prefix .. "../../build/lib?.so"
#           require("init_ngx_lua_cpp")
#       }
#
#       # UDP echo via ngx_lua_cpp: read the datagram, offload a sleep to the
#       # C++ worker pool, reply. Reply: "pong [<payload>] lua_cpp=true ..."
#       server {
#           listen 9000 udp;
#           content_by_lua_block {
#               local inst = require("init_ngx_lua_cpp")
#               local payload = ""
#               local sock, err = ngx.req.socket()
#               if sock then
#                   local data
#                   data, err = sock:receive(0)   -- never blocks in UDP mode
#                   if data then payload = data end
#               end
#               local value = inst:sleep(20)      -- coroutine on the worker pool
#               ngx.say("pong [" .. payload .. "] lua_cpp=" ..
#                   tostring(inst:is_running()) .. " sleep=" .. tostring(value) ..
#                   " from=" .. tostring(ngx.var.remote_addr) .. ":" ..
#                   tostring(ngx.var.remote_port))
#           }
#       }
#
#       # minimal pure-Lua UDP service for comparison
#       server {
#           listen 9001 udp;
#           content_by_lua_block {
#               ngx.say("hello-udp")
#           }
#       }
#   }
