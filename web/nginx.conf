# ngx_lua_cpp demo center server
# OpenResty nginx configuration
#
# Usage:
#   Start OpenResty with the repository web/ directory as the prefix:
#     nginx.exe -p C:/Code/ngx_lua_cpp/web/run -c conf/nginx.conf
#   Open http://localhost:8080 in your browser.
#
# All paths are resolved relative to the nginx prefix (web/run), so this
# config works without editing:
#   - Lua sources:   <prefix>/../demo        (repo demo/)
#   - built library: <prefix>/../../build/Debug (repo build/Debug/ngx_lua_cpp.dll)

worker_processes 1;
error_log logs/error.log info;
pid       logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    access_log logs/access.log;

    sendfile   on;
    keepalive_timeout 65;

    # Shared dictionary for storing execution history
    lua_shared_dict exec_history 1m;

    init_worker_by_lua_block {
        local prefix = ngx.config.prefix()
        package.path = package.path .. ";" .. prefix .. "../../demo/?.lua"
        package.cpath = package.cpath .. ";" .. prefix .. "../../build/Debug/?.dll"
        require("init_ngx_lua_cpp")
    }

    server {
        listen 8080;
        server_name localhost;

        # Serve static files (index.html, etc.)
        location / {
            root   html;
            index  index.html;
        }

        # Basic coroutine demo
        location /lua.html {
            default_type text/html;
            content_by_lua_block {
                local inst = require("init_ngx_lua_cpp")
                local value = inst:sleep(40)
                ngx.say("ngx_lua_cpp http demo! Running " .. tostring(inst:is_running()) .. " | " .. tostring(value))
            }
        }

        # ---------------------------------------------------------------
        # Demo 1: parallel mandelbrot renderer
        #   mode 0 = parallel (row tasks on the worker pool)
        #   mode 1 = serial   (single worker thread)
        # ---------------------------------------------------------------
        location /api/mandelbrot {
            default_type application/json;
            content_by_lua_block {
                local inst = require("init_ngx_lua_cpp")
                local args = ngx.req.get_uri_args()
                local w = tonumber(args.w) or 480
                local h = tonumber(args.h) or 360
                local iter = tonumber(args.iter) or 300
                local cx = tonumber(args.cx) or -0.5
                local cy = tonumber(args.cy) or 0.0
                local zoom = tonumber(args.zoom) or 1
                local mode = tonumber(args.mode) or 0

                local t0 = ngx.now()
                local res = inst:mandelbrot(w, h, iter, cx, cy, zoom, mode)
                local bmp, elapsed = res[1], res[2]

                local cjson = require("cjson.safe")
                ngx.say(cjson.encode({
                    ok = true,
                    w = w, h = h, iter = iter, cx = cx, cy = cy, zoom = zoom, mode = mode,
                    elapsed_ms = elapsed,
                    wall_ms = math.floor((ngx.now() - t0) * 1000),
                    bmp = ngx.encode_base64(bmp),
                }))
            }
        }

        # ---------------------------------------------------------------
        # Demo 2: concurrent http fetch (fan-out / fan-in)
        #   POST {"urls": [...], "timeout": 5000}
        # ---------------------------------------------------------------
        location /api/fetch {
            default_type application/json;
            content_by_lua_block {
                ngx.req.read_body()
                local cjson = require("cjson.safe")
                local data = cjson.decode(ngx.req.get_body_data() or "")
                if not data or type(data.urls) ~= "table" or #data.urls == 0 then
                    ngx.status = 400
                    ngx.say(cjson.encode({ok = false, error = 'expected {"urls": [...]}'}))
                    return
                end

                local inst = require("init_ngx_lua_cpp")
                local timeout = tonumber(data.timeout) or 5000

                local t0 = ngx.now()
                local res = inst:fetch(data.urls, timeout)
                local entries, total = res[1], res[2]

                local out = {}
                for i = 1, #entries do
                    local e = entries[i]
                    out[i] = {url = e[1], ok = e[2], status = e[3], bytes = e[4], elapsed_ms = e[5], info = e[6]}
                end

                ngx.say(cjson.encode({
                    ok = true,
                    url_count = #entries,
                    total_ms = total,
                    wall_ms = math.floor((ngx.now() - t0) * 1000),
                    results = out,
                }))
            }
        }

        # ---------------------------------------------------------------
        # Demo 3: in-memory job queue
        # ---------------------------------------------------------------
        location /api/jobs/submit {
            default_type application/json;
            content_by_lua_block {
                ngx.req.read_body()
                local cjson = require("cjson.safe")
                local data = cjson.decode(ngx.req.get_body_data() or "")
                if not data or type(data.kind) ~= "string" then
                    ngx.status = 400
                    ngx.say(cjson.encode({ok = false, error = 'expected {"kind": "...", "payload": {...}}'}))
                    return
                end

                local inst = require("init_ngx_lua_cpp")
                local payload = data.payload or {}
                local id = inst:job_submit(data.kind, payload)
                if id == "" then
                    ngx.status = 500
                    ngx.say(cjson.encode({ok = false, error = "job_submit failed (is ngx_lua_cpp running?)"}))
                    return
                end
                ngx.say(cjson.encode({ok = true, id = id}))
            }
        }

        location /api/jobs/query {
            default_type application/json;
            content_by_lua_block {
                local cjson = require("cjson.safe")
                local args = ngx.req.get_uri_args()
                local id = args.id
                if not id then
                    ngx.status = 400
                    ngx.say(cjson.encode({ok = false, error = "missing id"}))
                    return
                end

                local inst = require("init_ngx_lua_cpp")
                local r = inst:job_query(id)
                ngx.say(cjson.encode({ok = true, id = id, status = r[1], progress = r[2], elapsed_ms = r[3], result = r[4]}))
            }
        }

        location /api/jobs/list {
            default_type application/json;
            content_by_lua_block {
                local cjson = require("cjson.safe")
                local inst = require("init_ngx_lua_cpp")
                local jobs = inst:job_list()
                local out = {}
                for i = 1, #jobs do
                    local j = jobs[i]
                    out[i] = {id = j[1], kind = j[2], status = j[3], progress = j[4], elapsed_ms = j[5]}
                end
                ngx.say(cjson.encode({ok = true, jobs = out}))
            }
        }

        # API: Execute Lua code (debug console)
        location /api/exec {
            default_type application/json;

            content_by_lua_block {
                ngx.req.read_body()
                local body = ngx.req.get_body_data()
                if not body then
                    ngx.status = 400
                    ngx.say('{"ok":false,"error":"Empty request body"}')
                    return
                end

                local cjson = require("cjson.safe")
                local data = cjson.decode(body)
                if not data or not data.code then
                    ngx.status = 400
                    ngx.say('{"ok":false,"error":"Invalid JSON or missing \\"code\\" field"}')
                    return
                end

                local code = data.code

                -- Capture output by overriding ngx.say/ngx.print within the chunk
                local output_parts = {}
                local env = setmetatable({
                    print = function(...)
                        local args = {...}
                        local parts = {}
                        for i = 1, select("#", ...) do
                            parts[#parts + 1] = tostring(args[i])
                        end
                        output_parts[#output_parts + 1] = table.concat(parts, "\t")
                    end,
                    ngx = ngx,
                    require = require,
                    tostring = tostring,
                    tonumber = tonumber,
                    type = type,
                    pairs = pairs,
                    ipairs = ipairs,
                    pcall = pcall,
                    xpcall = xpcall,
                    error = error,
                    assert = assert,
                    select = select,
                    unpack = unpack,
                    table = table,
                    string = string,
                    math = math,
                    os = os,
                    io = io,
                    coroutine = coroutine,
                    collectgarbage = collectgarbage,
                    rawget = rawget,
                    rawset = rawset,
                    setmetatable = setmetatable,
                    getmetatable = getmetatable,
                }, {__index = _G})

                local fn, err = loadstring(code)
                if not fn then
                    ngx.say(cjson.encode({ok = false, error = "Compile error: " .. err}))
                    return
                end

                setfenv(fn, env)

                local ok, result = pcall(fn)
                local output = table.concat(output_parts, "\n")

                if ok then
                    local res = {ok = true, output = output}
                    if result ~= nil then
                        res.result = tostring(result)
                    end
                    ngx.say(cjson.encode(res))
                else
                    ngx.say(cjson.encode({ok = false, error = tostring(result), output = output}))
                end
            }
        }

        # API: Retrieve server logs
        location /api/logs {
            default_type application/json;

            content_by_lua_block {
                local cjson = require("cjson.safe")
                local args = ngx.req.get_uri_args()
                local log_type = args.type or "error"
                local lines = tonumber(args.lines) or 100

                local log_file
                if log_type == "access" then
                    log_file = ngx.config.prefix() .. "logs/access.log"
                else
                    log_file = ngx.config.prefix() .. "logs/error.log"
                end

                -- Read log file directly (no shell commands)
                local f = io.open(log_file, "r")
                if not f then
                    ngx.say(cjson.encode({ok = false, error = "Failed to open log file"}))
                    return
                end

                -- Read all lines and keep only the last N
                local all_lines = {}
                for line in f:lines() do
                    all_lines[#all_lines + 1] = line
                end
                f:close()

                local start = math.max(1, #all_lines - math.min(lines, 10000) + 1)
                local tail_lines = {}
                for i = start, #all_lines do
                    tail_lines[#tail_lines + 1] = all_lines[i]
                end
                local content = table.concat(tail_lines, "\n")

                ngx.say(cjson.encode({
                    ok = true,
                    log_type = log_type,
                    file = log_file,
                    content = content
                }))
            }
        }

        # API: Clear logs
        location /api/logs/clear {
            default_type application/json;

            content_by_lua_block {
                local cjson = require("cjson.safe")
                local args = ngx.req.get_uri_args()
                local log_type = args.type or "error"

                local log_file
                if log_type == "access" then
                    log_file = ngx.config.prefix() .. "logs/access.log"
                else
                    log_file = ngx.config.prefix() .. "logs/error.log"
                end

                local ok, err = pcall(function()
                    local f = io.open(log_file, "w")
                    if f then
                        f:close()
                    end
                end)

                if ok then
                    ngx.say(cjson.encode({ok = true, message = log_type .. " log cleared"}))
                else
                    ngx.say(cjson.encode({ok = false, error = tostring(err)}))
                end
            }
        }

        # API: Server info
        location /api/info {
            default_type application/json;

            content_by_lua_block {
                local cjson = require("cjson.safe")

                local info = {
                    ok = true,
                    ngx_lua_version = ngx.config.ngx_lua_version,
                    nginx_version = ngx.config.nginx_version,
                    worker_pid = ngx.worker.pid(),
                    worker_count = ngx.worker.count(),
                    prefix = ngx.config.prefix(),
                }

                -- Try to load ngx_lua_cpp info
                local inst_ok, inst = pcall(require, "init_ngx_lua_cpp")
                if inst_ok and inst then
                    info.ngx_lua_cpp = true
                    info.ngx_lua_cpp_running = inst:is_running()
                    info.threads = inst:get_hardware_concurrency()
                else
                    info.ngx_lua_cpp = false
                end

                ngx.say(cjson.encode(info))
            }
        }
    }
}
