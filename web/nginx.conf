# ngx_lua_cpp demo center server
# OpenResty nginx configuration
#
# Usage:
#   Start OpenResty with the repository web/ directory as the prefix:
#     nginx.exe -p C:/Code/ngx_lua_cpp/web/run -c conf/nginx.conf
#   Open http://localhost:8080 in your browser.
#
# All paths are resolved relative to the nginx prefix (web/run), so this
# config works without editing:
#   - Lua sources:   <prefix>/../demo        (repo demo/)
#   - built library: <prefix>/../../build64 (repo build64/, 64-bit DLL built
#                     against the new OpenResty's LuaJIT)
#
# UDP (Demo 4/5): nginx's stream module compiles "listen ... udp" OUT on
# Windows (#if !(NGX_WIN32) in ngx_stream_core_module.c), so no nginx -- old
# or new -- can declare a UDP listener in nginx.conf here. ngx_lua_cpp binds
# the datagram sockets itself instead (udp_listen/udp_recv/udp_send, started
# below via udp_echo_server.lua), which works on any platform. See
# web/nginx-udp-sample.conf for a Linux-only native stream-UDP variant.

worker_processes 1;
# Single process: ngx_lua's init_worker_by_lua runs in the master process
# too, which would duplicate the UDP listeners / worker pool and let the two
# instances fight over the same ports. master_process off makes this a pure
# single-process demo server (stop/reload still work through the pid file).
master_process off;
error_log logs/error.log info;
pid       logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    access_log logs/access.log;

    sendfile   on;
    keepalive_timeout 65;
    # allow large uploads (Demo D11 hashes files up to 64 MB)
    client_max_body_size 64m;

    # Shared dictionary for storing execution history
    lua_shared_dict exec_history 1m;
    # Shared dictionary for the API-gateway rate limiter (Demo B4)
    lua_shared_dict limit_store 10m;

    init_worker_by_lua_block {
        local prefix = ngx.config.prefix()
        package.path = package.path .. ";" .. prefix .. "../../demo/?.lua"
        -- the native library is located by demo/init_ngx_lua_cpp.lua via
        -- package.loadlib, ordered by process bitness (build64/ for 64-bit
        -- OpenResty, build/ for 32-bit like WinNMP's), Release first: the
        -- Debug build's assert() can pop blocking message boxes on desktop.
        local inst = require("init_ngx_lua_cpp")

        -- UDP listeners require the C++ build with the datagram APIs
        -- (udp_listen/udp_recv/udp_reply). Older DLL builds (or an old
        -- OpenResty that only has them) still serve every HTTP/TCP demo;
        -- the datagram services are simply skipped so startup never fails.
        if inst and type(inst.udp_listen) == "function" then
            -- Demo 5: UDP listeners owned by the C++ instance (see udp_echo_server.lua)
            require("udp_echo_server").start(9000, "echo")   -- "pong [<payload>] lua_cpp=true ..."
            require("udp_echo_server").start(9001, "hello")  -- fixed "hello-udp" reply

            -- Demo A2: UDP syslog collector (port 514) -> event bus topic "syslog"
            require("syslog_collector").start(514)

            -- Demo A1: DNS-over-UDP forwarder (port 53, upstream 114.114.114.114)
            require("dns_server").start(53, "114.114.114.114")
        else
            ngx.log(ngx.WARN, "ngx_lua_cpp: UDP APIs not available - datagram listeners skipped (TCP/HTTP demos unaffected)")
        end
    }

    server {
        listen 8080;
        server_name localhost;

        # Serve static files (index.html, etc.)
        location / {
            root   html;
            index  index.html;
        }

        # Basic coroutine demo
        location /lua.html {
            default_type text/html;
            content_by_lua_block {
                local inst = require("init_ngx_lua_cpp")
                local value = inst:sleep(40)
                ngx.say("ngx_lua_cpp http demo! Running " .. tostring(inst:is_running()) .. " | " .. tostring(value))
            }
        }

        # ---------------------------------------------------------------
        # Demo 1: parallel mandelbrot renderer
        #   mode 0 = parallel (row tasks on the worker pool)
        #   mode 1 = serial   (single worker thread)
        # ---------------------------------------------------------------
        location /api/mandelbrot {
            default_type application/json;
            content_by_lua_block {
                local inst = require("init_ngx_lua_cpp")
                local args = ngx.req.get_uri_args()
                local w = tonumber(args.w) or 480
                local h = tonumber(args.h) or 360
                local iter = tonumber(args.iter) or 300
                local cx = tonumber(args.cx) or -0.5
                local cy = tonumber(args.cy) or 0.0
                local zoom = tonumber(args.zoom) or 1
                local mode = tonumber(args.mode) or 0

                local t0 = ngx.now()
                local res = inst:mandelbrot(w, h, iter, cx, cy, zoom, mode)
                local bmp, elapsed = res[1], res[2]

                local cjson = require("cjson.safe")
                ngx.say(cjson.encode({
                    ok = true,
                    w = w, h = h, iter = iter, cx = cx, cy = cy, zoom = zoom, mode = mode,
                    elapsed_ms = elapsed,
                    wall_ms = math.floor((ngx.now() - t0) * 1000),
                    bmp = ngx.encode_base64(bmp),
                }))
            }
        }

        # ---------------------------------------------------------------
        # Demo 2: concurrent http fetch (fan-out / fan-in)
        #   POST {"urls": [...], "timeout": 5000}
        # ---------------------------------------------------------------
        location /api/fetch {
            default_type application/json;
            content_by_lua_block {
                ngx.req.read_body()
                local cjson = require("cjson.safe")
                local data = cjson.decode(ngx.req.get_body_data() or "")
                if not data or type(data.urls) ~= "table" or #data.urls == 0 then
                    ngx.status = 400
                    ngx.say(cjson.encode({ok = false, error = 'expected {"urls": [...]}'}))
                    return
                end

                local inst = require("init_ngx_lua_cpp")
                local timeout = tonumber(data.timeout) or 5000

                local t0 = ngx.now()
                local res = inst:fetch(data.urls, timeout)
                local entries, total = res[1], res[2]

                local out = {}
                for i = 1, #entries do
                    local e = entries[i]
                    out[i] = {url = e[1], ok = e[2], status = e[3], bytes = e[4], elapsed_ms = e[5], info = e[6]}
                end

                ngx.say(cjson.encode({
                    ok = true,
                    url_count = #entries,
                    total_ms = total,
                    wall_ms = math.floor((ngx.now() - t0) * 1000),
                    results = out,
                }))
            }
        }

        # ---------------------------------------------------------------
        # Demo 3: in-memory job queue
        # ---------------------------------------------------------------
        location /api/jobs/submit {
            default_type application/json;
            content_by_lua_block {
                ngx.req.read_body()
                local cjson = require("cjson.safe")
                local data = cjson.decode(ngx.req.get_body_data() or "")
                if not data or type(data.kind) ~= "string" then
                    ngx.status = 400
                    ngx.say(cjson.encode({ok = false, error = 'expected {"kind": "...", "payload": {...}}'}))
                    return
                end

                local inst = require("init_ngx_lua_cpp")
                local payload = data.payload or {}
                local id = inst:job_submit(data.kind, payload)
                if id == "" then
                    ngx.status = 500
                    ngx.say(cjson.encode({ok = false, error = "job_submit failed (is ngx_lua_cpp running?)"}))
                    return
                end
                ngx.say(cjson.encode({ok = true, id = id}))
            }
        }

        location /api/jobs/query {
            default_type application/json;
            content_by_lua_block {
                local cjson = require("cjson.safe")
                local args = ngx.req.get_uri_args()
                local id = args.id
                if not id then
                    ngx.status = 400
                    ngx.say(cjson.encode({ok = false, error = "missing id"}))
                    return
                end

                local inst = require("init_ngx_lua_cpp")
                local r = inst:job_query(id)
                ngx.say(cjson.encode({ok = true, id = id, status = r[1], progress = r[2], elapsed_ms = r[3], result = r[4]}))
            }
        }

        location /api/jobs/list {
            default_type application/json;
            content_by_lua_block {
                local cjson = require("cjson.safe")
                local inst = require("init_ngx_lua_cpp")
                local jobs = inst:job_list()
                local out = {}
                for i = 1, #jobs do
                    local j = jobs[i]
                    out[i] = {id = j[1], kind = j[2], status = j[3], progress = j[4], elapsed_ms = j[5]}
                end
                ngx.say(cjson.encode({ok = true, jobs = out}))
            }
        }

        # ---------------------------------------------------------------
        # Demo 4: UDP round-trip via ngx_lua_cpp
        #   POST {"host":"127.0.0.1", "port":9000, "payload":"hi", "timeout":2000}
        #   The blocking Winsock datagram exchange runs on the C++ worker
        #   pool; the reply below comes back from the stream UDP listener.
        # ---------------------------------------------------------------
        location /api/udp {
            default_type application/json;
            content_by_lua_block {
                ngx.req.read_body()
                local cjson = require("cjson.safe")
                local data = cjson.decode(ngx.req.get_body_data() or "")
                if not data or not data.payload then
                    ngx.status = 400
                    ngx.say(cjson.encode({ok = false, error = 'expected {"payload": "...", "host": "...", "port": 9000, "timeout": 2000}'}))
                    return
                end

                local inst = require("init_ngx_lua_cpp")
                local host = data.host or "127.0.0.1"
                local port = tonumber(data.port) or 9000
                local timeout = tonumber(data.timeout) or 2000

                local t0 = ngx.now()
                local res = inst:udp_echo(host, port, tostring(data.payload), timeout)
                ngx.say(cjson.encode({
                    ok = true,
                    success = res[1],
                    reply = res[2],
                    elapsed_ms = res[3],
                    info = res[4],
                    wall_ms = math.floor((ngx.now() - t0) * 1000),
                }))
            }
        }

        # ---------------------------------------------------------------
        # Realtime: WebSocket endpoint (realtime panel)
        #   client sends "topic:<name>" to subscribe; server pushes
        #   "ev:<id>|<ts_ms>|<payload>" frames for new bus events.
        # ---------------------------------------------------------------
        location /ws {
            content_by_lua_block {
                local server = require("resty.websocket.server")
                local wb, err = server:new({ timeout = 300, max_payload_len = 65536 })
                if not wb then
                    ngx.log(ngx.ERR, "websocket handshake failed: ", err)
                    return ngx.exit(444)
                end

                local inst = require("init_ngx_lua_cpp")
                local topic = "jobs"
                local last_id = 0

                while true do
                    local data, typ, recv_err = wb:recv_frame()
                    if not data and (recv_err == "closed" or recv_err == "interrupted") then
                        break
                    end
                    if data and typ == "text" and data:sub(1, 6) == "topic:" then
                        topic = data:sub(7)
                        last_id = 0
                    end

                    local res = inst:events(topic, last_id)
                    local evs, next_id = res[1], res[2]
                    for i = 1, #evs do
                        local e = evs[i]
                        local ok, send_err = wb:send_text("ev:" .. e[1] .. "|" .. e[2] .. "|" .. e[3])
                        if not ok then
                            ngx.log(ngx.INFO, "ws send failed: ", send_err)
                            return
                        end
                    end
                    last_id = next_id
                end
            }
        }

        # ---------------------------------------------------------------
        # Realtime: Server-Sent Events stream
        #   /api/stream?topic=jobs&last=0  -> "id: <id>\ndata: <payload>\n\n"
        # ---------------------------------------------------------------
        location /api/stream {
            default_type text/event-stream;
            content_by_lua_block {
                local inst = require("init_ngx_lua_cpp")
                local topic = ngx.var.arg_topic or "jobs"
                local last_id = tonumber(ngx.var.arg_last) or 0

                ngx.header["Cache-Control"] = "no-cache"
                ngx.header["X-Accel-Buffering"] = "no"
                ngx.print("retry: 2000\n\n")
                ngx.flush(true)

                while true do
                    local res = inst:events(topic, last_id)
                    local evs, next_id = res[1], res[2]
                    for i = 1, #evs do
                        local e = evs[i]
                        ngx.print("id: " .. e[1] .. "\ndata: " .. e[3] .. "\n\n")
                    end
                    last_id = next_id
                    ngx.flush(true)
                    ngx.sleep(0.3)
                end
            }
        }

        # ---------------------------------------------------------------
        # syslog: recent messages + self-test sender
        # ---------------------------------------------------------------
        location /api/syslog/recent {
            default_type application/json;
            content_by_lua_block {
                local cjson = require("cjson.safe")
                local collector = require("syslog_collector")
                local n = tonumber(ngx.var.arg_n) or 50
                local recent = collector.get_recent(n)
                local out = {}
                for i = 1, #recent do
                    local e = recent[i]
                    out[i] = { line = e.line, from = e.from, pri = e.pri, ts = e.ts, host = e.host, msg = e.msg }
                end
                ngx.say(cjson.encode({ ok = true, count = #out, entries = out }))
            }
        }

        location /api/syslog/send {
            default_type application/json;
            content_by_lua_block {
                local cjson = require("cjson.safe")
                local inst = require("init_ngx_lua_cpp")
                local msg = ngx.var.arg_msg or "hello from syslog self-test"
                local pri = tonumber(ngx.var.arg_pri) or 134
                local payload = "<" .. pri .. ">Aug 17 00:00:01 demo-app " .. msg
                local r = inst:udp_send("127.0.0.1", 514, payload)
                ngx.say(cjson.encode({ ok = r[1], err = r[2], payload = payload }))
            }
        }

        # ---------------------------------------------------------------
        # Demo B4: API gateway - JWT login, protected endpoints, rate limit
        # ---------------------------------------------------------------
        location /api/auth/login {
            default_type application/json;
            content_by_lua_block {
                ngx.req.read_body()
                local cjson = require("cjson.safe")
                local data = cjson.decode(ngx.req.get_body_data() or "")
                if not data or not data.user then
                    ngx.status = 400
                    ngx.say(cjson.encode({ok = false, error = 'expected {"user": "...", "secret": "..."}'}))
                    return
                end
                local inst = require("init_ngx_lua_cpp")
                local secret = data.secret or "demo-secret"
                local jwt = require("jwt")
                local token = jwt.sign(inst, { user = data.user, sub = "demo" }, secret, 3600)
                ngx.say(cjson.encode({ok = true, token = token, expires_in = 3600}))
            }
        }

        location /api/secure/ {
            default_type application/json;
            access_by_lua_block {
                -- rate limit: 10 req/s with a burst of 20 per client
                local limit_req = require("resty.limit.req")
                local lim, lim_err = limit_req.new("limit_store", 10, 20)
                if lim then
                    local key = ngx.var.binary_remote_addr
                    local delay, rerr = lim:incoming(key, true)
                    if not delay then
                        if rerr == "rejected" then
                            ngx.log(ngx.WARN, "rate limited: ", key)
                            return ngx.exit(429)
                        end
                        ngx.log(ngx.ERR, "rate limiter error: ", rerr)
                    end
                    if delay > 0 then
                        ngx.sleep(delay)
                    end
                else
                    ngx.log(ngx.ERR, "failed to init rate limiter: ", lim_err)
                end

                -- JWT gate (HS256, signed by the C++ hmac_sha256_raw)
                local jwt = require("jwt")
                local inst = require("init_ngx_lua_cpp")
                local secret = ngx.var.arg_secret or "demo-secret"
                local auth = ngx.var.http_authorization or ""
                local token = auth:match("^Bearer%s+(.+)$")
                if not token then
                    token = ngx.var.arg_token
                end
                local payload, err = jwt.verify(inst, token, secret)
                if not payload then
                    local cjson = require("cjson.safe")
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({ok = false, error = err or "unauthorized"}))
                    return ngx.exit(ngx.status)
                end
                ngx.ctx.jwt_user = payload.user or "anonymous"
                ngx.ctx.jwt_sub = payload.sub or ""
            }
            content_by_lua_block {
                local cjson = require("cjson.safe")
                local inst = require("init_ngx_lua_cpp")
                ngx.say(cjson.encode({
                    ok = true,
                    user = ngx.ctx.jwt_user,
                    sub = ngx.ctx.jwt_sub,
                    lua_cpp = inst:is_running(),
                    time = ngx.time(),
                }))
            }
        }

        # ---------------------------------------------------------------
        # Demo B5: HMAC-signed webhook ingest
        #   POST /api/webhook/ingest?secret=demo-secret
        #   Header: X-Ngx-Signature: <hex hmac_sha256(secret, body)>
        #   Body:   {"kind":"count_primes","payload":{"limit":5000000}}
        # ---------------------------------------------------------------
        location /api/webhook/ingest {
            default_type application/json;
            content_by_lua_block {
                ngx.req.read_body()
                local cjson = require("cjson.safe")
                local body = ngx.req.get_body_data() or ""
                local inst = require("init_ngx_lua_cpp")
                local secret = ngx.var.arg_secret or "demo-secret"
                local webhook = require("webhook")
                local ok, job_id, err = webhook.ingest(inst, body, secret)
                if not ok then
                    ngx.status = 401
                    ngx.say(cjson.encode({ok = false, error = err}))
                    return
                end
                ngx.say(cjson.encode({ok = true, job_id = job_id}))
            }
        }

        # ---------------------------------------------------------------
        # Demo A1: DNS query API (talks to the UDP-53 forwarder above)
        #   GET /api/dns/query?name=myapp.test          (local override)
        #   GET /api/dns/query?name=www.baidu.com&type=1 (forwarded)
        # ---------------------------------------------------------------
        location /api/dns/query {
            default_type application/json;
            content_by_lua_block {
                local cjson = require("cjson.safe")
                local inst = require("init_ngx_lua_cpp")
                local dns = require("dns_server")
                local name = ngx.var.arg_name or "myapp.test"
                local qtype = tonumber(ngx.var.arg_type) or 1

                local query = dns.build_query(inst, name, qtype)
                local t0 = ngx.now()
                local r = inst:udp_echo("127.0.0.1", 53, query, 3000)
                local wall_ms = math.floor((ngx.now() - t0) * 1000)

                if not r[1] then
                    ngx.say(cjson.encode({ok = false, name = name, error = r[4], wall_ms = wall_ms}))
                    return
                end
                local ancount, ip = dns.parse_response(r[2])
                ngx.say(cjson.encode({
                    ok = true,
                    name = name,
                    type = qtype,
                    ancount = ancount,
                    answer_ip = ip,
                    response_len = #r[2],
                    elapsed_ms = r[3],
                    wall_ms = wall_ms,
                }))
            }
        }

        # ---------------------------------------------------------------
        # Demo D9: C++ LRU cache API
        # ---------------------------------------------------------------
        location /api/cache/ {
            default_type application/json;
            content_by_lua_block {
                local cjson = require("cjson.safe")
                local inst = require("init_ngx_lua_cpp")

                local action = ngx.var.uri:match("/api/cache/(%w+)")
                if action == "set" then
                    ngx.req.read_body()
                    local data = cjson.decode(ngx.req.get_body_data() or "")
                    if not data or not data.key then
                        ngx.status = 400
                        ngx.say(cjson.encode({ok = false, error = 'expected {"key","value","ttl"}'}))
                        return
                    end
                    local ok = inst:cache_set(data.key, tostring(data.value or ""), tonumber(data.ttl) or 60000)
                    ngx.say(cjson.encode({ok = true, stored = ok, key = data.key}))
                elseif action == "get" then
                    local key = ngx.var.arg_key or ""
                    local r = inst:cache_get(key)
                    ngx.say(cjson.encode({ok = true, found = r[1], value = r[2], ttl_ms = r[3]}))
                elseif action == "stats" then
                    ngx.say(cjson.encode({ok = true, stats = inst:cache_stats()}))
                elseif action == "compute" then
                    -- computed-cache demo: miss -> simulate expensive work on
                    -- the C++ worker pool -> store -> return
                    local key = ngx.var.arg_key or "computed:demo"
                    local ttl = tonumber(ngx.var.arg_ttl) or 30000
                    local got = inst:cache_get(key)
                    if got[1] then
                        ngx.say(cjson.encode({ok = true, key = key, cached = true, value = got[2], ttl_ms = got[3]}))
                        return
                    end
                    local t0 = ngx.now()
                    inst:sleep(200) -- simulate an expensive computation
                    local value = "computed-" .. inst:random_hex(6)
                    inst:cache_set(key, value, ttl)
                    ngx.say(cjson.encode({ok = true, key = key, cached = false, value = value,
                        compute_ms = math.floor((ngx.now() - t0) * 1000), ttl_ms = ttl}))
                else
                    ngx.status = 404
                    ngx.say(cjson.encode({ok = false, error = "unknown action"}))
                end
            }
        }

        # ---------------------------------------------------------------
        # Demo D11: file upload -> C++ SHA-256 pipeline
        #   POST /api/upload with the raw file bytes as the body
        #   (Content-Type: application/octet-stream); nginx buffers the
        #   body (memory or temp file), the C++ worker hashes it.
        # ---------------------------------------------------------------
        location /api/upload {
            default_type application/json;
            content_by_lua_block {
                local cjson = require("cjson.safe")
                local inst = require("init_ngx_lua_cpp")

                ngx.req.read_body()
                local data = ngx.req.get_body_data()
                local name = ngx.var.arg_name or "upload.bin"

                local t0 = ngx.now()
                local hex, size, elapsed
                if data then
                    -- small body buffered in memory: hash the raw bytes
                    hex = inst:sha256(data)
                    size = #data
                    elapsed = math.floor((ngx.now() - t0) * 1000)
                else
                    -- large body spilled to a temp file by nginx: hash it
                    -- on the C++ worker pool (blocking I/O offloaded)
                    local file = ngx.req.get_body_file()
                    if not file then
                        ngx.status = 400
                        ngx.say(cjson.encode({ok = false, error = "no body received"}))
                        return
                    end
                    local r = inst:file_sha256(file)
                    hex, size, elapsed = r[1], r[2], r[3]
                end

                ngx.say(cjson.encode({
                    ok = true,
                    name = name,
                    sha256 = hex,
                    size = size,
                    elapsed_ms = elapsed,
                    wall_ms = math.floor((ngx.now() - t0) * 1000),
                }))
            }
        }

        # ---------------------------------------------------------------
        # Demo D8: access log analysis (C++ parse on the worker pool)
        #   GET /api/stats/access?lines=5000
        # ---------------------------------------------------------------
        location /api/stats/access {
            default_type application/json;
            content_by_lua_block {
                local cjson = require("cjson.safe")
                local inst = require("init_ngx_lua_cpp")
                local lines = tonumber(ngx.var.arg_lines) or 5000
                local log_file = ngx.config.prefix() .. "logs/access.log"
                local r = inst:log_analyze(log_file, lines)
                ngx.say(cjson.encode({
                    ok = true,
                    stats = r[1],
                    top_urls = r[2],
                    statuses = r[3],
                    per_second = r[4],
                }))
            }
        }

        # ---------------------------------------------------------------
        # Demo E12: bridge to the WinNMP legacy stack (php-cgi + MySQL)
        #   Start once:
        #     php-cgi.exe -b 127.0.0.1:9000 -c php.ini   (WinNMP php-5.4.35)
        #     mysqld.exe --datadir=<winnmp>\bin\mysql-5.6.22\data --skip-log-bin
        #   Then open http://localhost:8080/php/test.php
        # ---------------------------------------------------------------
        location ~ ^/php/(.+\.php)$ {
            root   html;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
            fastcgi_param QUERY_STRING    $query_string;
            fastcgi_param REQUEST_METHOD  $request_method;
            fastcgi_param CONTENT_TYPE    $content_type;
            fastcgi_param CONTENT_LENGTH  $content_length;
            fastcgi_param REQUEST_URI     $request_uri;
            fastcgi_param DOCUMENT_URI    $document_uri;
            fastcgi_param DOCUMENT_ROOT   $document_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx;
            fastcgi_param REMOTE_ADDR     $remote_addr;
            fastcgi_param REMOTE_PORT     $remote_port;
            fastcgi_param SERVER_ADDR     $server_addr;
            fastcgi_param SERVER_PORT     $server_port;
            fastcgi_param SERVER_NAME     $server_name;
            fastcgi_param REDIRECT_STATUS 200;
        }

        # API: Execute Lua code (debug console)
        location /api/exec {
            default_type application/json;

            content_by_lua_block {
                ngx.req.read_body()
                local body = ngx.req.get_body_data()
                if not body then
                    ngx.status = 400
                    ngx.say('{"ok":false,"error":"Empty request body"}')
                    return
                end

                local cjson = require("cjson.safe")
                local data = cjson.decode(body)
                if not data or not data.code then
                    ngx.status = 400
                    ngx.say('{"ok":false,"error":"Invalid JSON or missing \\"code\\" field"}')
                    return
                end

                local code = data.code

                -- Capture output by overriding ngx.say/ngx.print within the chunk
                local output_parts = {}
                local env = setmetatable({
                    print = function(...)
                        local args = {...}
                        local parts = {}
                        for i = 1, select("#", ...) do
                            parts[#parts + 1] = tostring(args[i])
                        end
                        output_parts[#output_parts + 1] = table.concat(parts, "\t")
                    end,
                    ngx = ngx,
                    require = require,
                    tostring = tostring,
                    tonumber = tonumber,
                    type = type,
                    pairs = pairs,
                    ipairs = ipairs,
                    pcall = pcall,
                    xpcall = xpcall,
                    error = error,
                    assert = assert,
                    select = select,
                    unpack = unpack,
                    table = table,
                    string = string,
                    math = math,
                    os = os,
                    io = io,
                    coroutine = coroutine,
                    collectgarbage = collectgarbage,
                    rawget = rawget,
                    rawset = rawset,
                    setmetatable = setmetatable,
                    getmetatable = getmetatable,
                }, {__index = _G})

                local fn, err = loadstring(code)
                if not fn then
                    ngx.say(cjson.encode({ok = false, error = "Compile error: " .. err}))
                    return
                end

                setfenv(fn, env)

                local ok, result = pcall(fn)
                local output = table.concat(output_parts, "\n")

                if ok then
                    local res = {ok = true, output = output}
                    if result ~= nil then
                        res.result = tostring(result)
                    end
                    ngx.say(cjson.encode(res))
                else
                    ngx.say(cjson.encode({ok = false, error = tostring(result), output = output}))
                end
            }
        }

        # API: Retrieve server logs
        location /api/logs {
            default_type application/json;

            content_by_lua_block {
                local cjson = require("cjson.safe")
                local args = ngx.req.get_uri_args()
                local log_type = args.type or "error"
                local lines = tonumber(args.lines) or 100

                local log_file
                if log_type == "access" then
                    log_file = ngx.config.prefix() .. "logs/access.log"
                else
                    log_file = ngx.config.prefix() .. "logs/error.log"
                end

                -- Read log file directly (no shell commands)
                local f = io.open(log_file, "r")
                if not f then
                    ngx.say(cjson.encode({ok = false, error = "Failed to open log file"}))
                    return
                end

                -- Read all lines and keep only the last N
                local all_lines = {}
                for line in f:lines() do
                    all_lines[#all_lines + 1] = line
                end
                f:close()

                local start = math.max(1, #all_lines - math.min(lines, 10000) + 1)
                local tail_lines = {}
                for i = start, #all_lines do
                    tail_lines[#tail_lines + 1] = all_lines[i]
                end
                local content = table.concat(tail_lines, "\n")

                ngx.say(cjson.encode({
                    ok = true,
                    log_type = log_type,
                    file = log_file,
                    content = content
                }))
            }
        }

        # API: Clear logs
        location /api/logs/clear {
            default_type application/json;

            content_by_lua_block {
                local cjson = require("cjson.safe")
                local args = ngx.req.get_uri_args()
                local log_type = args.type or "error"

                local log_file
                if log_type == "access" then
                    log_file = ngx.config.prefix() .. "logs/access.log"
                else
                    log_file = ngx.config.prefix() .. "logs/error.log"
                end

                local ok, err = pcall(function()
                    local f = io.open(log_file, "w")
                    if f then
                        f:close()
                    end
                end)

                if ok then
                    ngx.say(cjson.encode({ok = true, message = log_type .. " log cleared"}))
                else
                    ngx.say(cjson.encode({ok = false, error = tostring(err)}))
                end
            }
        }

        # API: Server info
        location /api/info {
            default_type application/json;

            content_by_lua_block {
                local cjson = require("cjson.safe")

                local info = {
                    ok = true,
                    ngx_lua_version = ngx.config.ngx_lua_version,
                    nginx_version = ngx.config.nginx_version,
                    worker_pid = ngx.worker.pid(),
                    worker_count = ngx.worker.count(),
                    prefix = ngx.config.prefix(),
                }

                -- Try to load ngx_lua_cpp info
                local inst_ok, inst = pcall(require, "init_ngx_lua_cpp")
                if inst_ok and type(inst) == "userdata" then
                    info.ngx_lua_cpp = true
                    info.ngx_lua_cpp_running = inst:is_running()
                    info.threads = inst:get_hardware_concurrency()
                else
                    info.ngx_lua_cpp = false
                end

                ngx.say(cjson.encode(info))
            }
        }
    }
}

